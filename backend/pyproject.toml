[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-dashboard"
version = "0.1.0"
description = "SEO-дашборд: ежедневный сбор данных вебмастеров и аналитик, история и подсветка изменений."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10,<4.0",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
]

[project.scripts]
seo-dashboard = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
